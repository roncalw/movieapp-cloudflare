<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="1460" viewBox="0 0 2520 1460" role="img" aria-labelledby="title desc">
  <title id="title">MovieApp Cloudflare Migration Strategy</title>
  <desc id="desc">Flow diagram showing the IMDb ratings file, TMDB discover movie feed, and TMDB movie enrichment API flowing through Cloudflare loaders into staging tables and final query tables.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <style>
      .bg { fill: #f8fafc; stroke: #d7dde6; stroke-width: 2; }
      .section { font: 700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #334155; }
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #334155; }
      .box-title { font: 700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .box-text { font: 400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #334155; }
      .small { font: 400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
      .source { fill: #dbeafe; stroke: #3b82f6; stroke-width: 3; }
      .process { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .staging { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .final { fill: #fee2e2; stroke: #dc2626; stroke-width: 3; }
      .query { fill: #ede9fe; stroke: #7c3aed; stroke-width: 3; }
      .line { stroke: #475569; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .label { fill: #475569; font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .step { fill: #dc2626; font: 800 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .divider { stroke: #cbd5e1; stroke-width: 2; }
      .sidebar-title { fill: #0f172a; font: 800 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .sidebar-category { fill: #0f172a; font: 800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .sidebar-step { fill: #334155; font: 400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="20" y="20" width="2480" height="1420" rx="24"/>

  <text class="title" x="50" y="70">MovieApp Cloudflare Migration Strategy</text>
  <text class="subtitle" x="50" y="110">TMDB plan: one-time manual discover/movie backfill first, then smaller weekly refreshes from the latest release_date already stored.</text>

  <line class="divider" x1="1620" y1="40" x2="1620" y2="1420" />

  <text class="sidebar-title" x="1670" y="90">Implementation Steps</text>
  <line class="divider" x1="1670" y1="104" x2="1915" y2="104" />

  <text class="sidebar-category" x="1670" y="150">Migration Strategy</text>
  <text class="sidebar-step" x="1700" y="178">Step 0: Migration Strategy</text>

  <text class="sidebar-category" x="1670" y="235">Database Setup</text>
  <text class="sidebar-step" x="1700" y="263">Step 1: Create The Migration File</text>
  <text class="sidebar-step" x="1700" y="290">Step 2: Paste The Database SQL</text>
  <text class="sidebar-step" x="1700" y="317">Step 3: Apply The Migration</text>

  <text class="sidebar-category" x="1670" y="374">IMDb Stream Proof</text>
  <text class="sidebar-step" x="1700" y="402">Step 4: Prove Cloudflare Can Stream Read The IMDb File</text>

  <text class="sidebar-category" x="1670" y="459">IMDb Setup And Load Into Staging</text>
  <text class="sidebar-step" x="1700" y="487">Step 5: Plan The IMDb Queue Job</text>
  <text class="sidebar-step" x="1700" y="514">Step 6: Wire Up The IMDb Queue</text>
  <text class="sidebar-step" x="1700" y="541">Step 7: Load The IMDb Ratings Staging Table</text>

  <text class="sidebar-category" x="1670" y="598">TMDB Setup And Load Into Staging</text>
  <text class="sidebar-step" x="1700" y="626">Step 8: Add The TMDB API Token As A Secret</text>
  <text class="sidebar-step" x="1700" y="653">Step 9: Load The TMDB Staging Tables</text>

  <text class="sidebar-category" x="1670" y="710">Final Movie List Build And Filter Checks</text>
  <text class="sidebar-step" x="1700" y="738">Step 10: Build The Final Movie List Table</text>
  <text class="sidebar-step" x="1700" y="765">Step 11: Test Genre Filtering</text>
  <text class="sidebar-step" x="1700" y="792">Step 12: Test Streamer Filtering</text>

  <text class="sidebar-category" x="1670" y="849">Future Worker API</text>
  <text class="sidebar-step" x="1700" y="877">Step 13: Sketch The Future Movies Search Endpoint</text>
  <text class="sidebar-step" x="1700" y="904">Step 14: Sketch The Future Movies Search Query</text>

  <text class="sidebar-category" x="1670" y="961">Rollout Back Into MovieApp</text>
  <text class="sidebar-step" x="1700" y="989">Step 15: Scale The Cloudflare Jobs Carefully</text>
  <text class="sidebar-step" x="1700" y="1016">Step 16: Hook This Back Into MovieApp</text>

  <text class="sidebar-category" x="1670" y="1073">Reference</text>
  <text class="sidebar-step" x="1700" y="1101">Step 17: Recommended Build Order</text>
  <text class="sidebar-step" x="1700" y="1128">Step 18: Useful Commands</text>
  <text class="sidebar-step" x="1700" y="1155">Step 19: Data Usage Notes</text>

  <text class="section" x="60" y="170">External inputs</text>
  <text class="section" x="60" y="445">Cloudflare load steps</text>
  <text class="section" x="60" y="790">D1 staging tables</text>
  <text class="section" x="60" y="1010">Final query tables</text>
  <text class="section" x="60" y="1260">Real-time Worker query</text>

  <rect class="source" x="60" y="200" width="420" height="150" rx="18"/>
  <text class="box-title" x="85" y="240">1. IMDb ratings file</text>
  <text class="box-text" x="85" y="275">title.ratings.tsv.gz</text>
  <text class="small" x="85" y="308">Fields we keep:</text>
  <text class="small" x="85" y="332">tconst, averageRating, numVotes</text>

  <rect class="source" x="590" y="200" width="420" height="170" rx="18"/>
  <text class="box-title" x="615" y="240">2. TMDB discover/movie</text>
  <text class="box-text" x="615" y="275">Main paginated TMDB feed</text>
  <text class="small" x="615" y="308">Gets us:</text>
  <text class="small" x="615" y="332">tmdb_id, title, poster_path,</text>
  <text class="small" x="615" y="354">release_date, popularity, genre_ids</text>

  <rect class="source" x="1120" y="200" width="420" height="170" rx="18"/>
  <text class="box-title" x="1145" y="240">3. TMDB movie enrichment API</text>
  <text class="box-text" x="1145" y="275">Per accepted movie id</text>
  <text class="small" x="1145" y="308">Gets only what discover is missing:</text>
  <text class="small" x="1145" y="332">imdb_id, US certification,</text>
  <text class="small" x="1145" y="354">watch providers</text>

  <rect class="process" x="100" y="500" width="340" height="140" rx="18"/>
  <text class="box-title" x="125" y="540">IMDb import worker</text>
  <text class="box-text" x="125" y="575">Reads the IMDb gzip file and writes</text>
  <text class="box-text" x="125" y="600">rating rows into D1 staging</text>

  <rect class="process" x="520" y="480" width="440" height="190" rx="18"/>
  <text class="box-title" x="545" y="520">TMDB primary load worker</text>
  <text class="box-text" x="545" y="555">Manual first backfill by page and date window,</text>
  <text class="box-text" x="545" y="580">then later smaller weekly refreshes from the</text>
  <text class="box-text" x="545" y="605">latest release_date already stored. Writes</text>
  <text class="box-text" x="545" y="630">tmdb_movies_staging and one</text>
  <text class="box-text" x="545" y="655">(tmdb_id, genre_id) row per genre into movie_genres.</text>

  <rect class="process" x="1080" y="480" width="420" height="190" rx="18"/>
  <text class="box-title" x="1105" y="520">TMDB enrichment worker</text>
  <text class="box-text" x="1105" y="555">Only for accepted tmdb_id values.</text>
  <text class="box-text" x="1105" y="580">Updates tmdb_movies_staging with</text>
  <text class="box-text" x="1105" y="605">imdb_id and us_certification, then</text>
  <text class="box-text" x="1105" y="630">writes one child row per provider into</text>
  <text class="box-text" x="1105" y="655">movie_watch_providers.</text>

  <rect class="staging" x="120" y="840" width="360" height="120" rx="18"/>
  <text class="box-title" x="145" y="880">imdb_ratings_staging</text>
  <text class="box-text" x="145" y="915">IMDb rating staging rows</text>

  <rect class="staging" x="820" y="840" width="400" height="120" rx="18"/>
  <text class="box-title" x="845" y="880">tmdb_movies_staging</text>
  <text class="box-text" x="845" y="915">Base movie row per tmdb_id.</text>
  <text class="box-text" x="845" y="939">Step 9B later fills imdb_id + certification</text>

  <rect class="final" x="120" y="1060" width="360" height="130" rx="18"/>
  <text class="box-title" x="145" y="1100">movie_list_items</text>
  <text class="box-text" x="145" y="1135">Built from tmdb_movies_staging</text>
  <text class="box-text" x="145" y="1159">joined to imdb_ratings_staging</text>

  <rect class="final" x="620" y="1060" width="360" height="130" rx="18"/>
  <text class="box-title" x="645" y="1100">movie_genres</text>
  <text class="box-text" x="645" y="1135">Child filter rows:</text>
  <text class="box-text" x="645" y="1159">(tmdb_id, genre_id)</text>

  <rect class="final" x="1120" y="1060" width="360" height="130" rx="18"/>
  <text class="box-title" x="1145" y="1100">movie_watch_providers</text>
  <text class="box-text" x="1145" y="1135">Child filter rows:</text>
  <text class="box-text" x="1145" y="1159">(tmdb_id, provider_id, region)</text>

  <rect class="query" x="480" y="1290" width="640" height="110" rx="18"/>
  <text class="box-title" x="505" y="1330">Real-time Worker query</text>
  <text class="box-text" x="505" y="1365">/movies/search reads movie_list_items as the parent table and joins movie_genres and</text>
  <text class="box-text" x="505" y="1389">movie_watch_providers when the user filters by genre or streamer.</text>

  <path class="line" d="M 310 350 L 310 500" />
  <text class="step" x="320" y="430">Steps 4-7</text>
  <path class="line" d="M 800 370 L 800 480" />
  <text class="step" x="700" y="430">Step 9A</text>
  <path class="line" d="M 1330 370 L 1330 480" />
  <text class="step" x="1335" y="430">Step 9B</text>

  <path class="line" d="M 300 640 L 300 840" />
  <text class="step" x="320" y="760">Step 7</text>
  <path class="line" d="M 860 670 L 860 840" />
  <text class="step" x="680" y="720">Step 9A</text>
  <path class="line" d="M 660 670 L 660 1055" />
  <text class="step" x="880" y="720">Step 9A</text>
  <path class="line" d="M 1290 670 L 1290 900 L 1220 900" />
  <text class="step" x="1190" y="740">Step 9B</text>
  <path class="line" d="M 1370 670 L 1370 1055" />
  <text class="step" x="1375" y="770">Step 9B</text>

  <path class="line" d="M 300 960 L 300 1060" />
  <text class="step" x="325" y="1000">Step 10</text>
  <path class="line" d="M 820 900 L 550 900 L 550 1130 L 480 1130" />
  <text class="step" x="560" y="890">Step 10</text>

  <path class="line" d="M 300 1190 L 300 1230 L 650 1230 L 650 1290" />
  <text class="step" x="390" y="1222">Steps 13-14</text>
  <path class="line" d="M 800 1190 L 800 1290" />
  <text class="step" x="820" y="1248">Steps 13-14</text>
  <path class="line" d="M 1300 1190 L 1300 1230 L 950 1230 L 950 1290" />
  <text class="step" x="1040" y="1222">Steps 13-14</text>

  <text class="label" x="890" y="790">secondary enrichment updates the same tmdb_id row</text>
  <text class="label" x="860" y="1020">join on imdb_id / tconst</text>
</svg>
